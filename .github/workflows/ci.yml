name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Documentation matches the code
        run: pnpm docs:check

      - name: Test
        run: pnpm test

      - name: Build the sample pack
        run: pnpm sample

      - name: Check the sample documents were produced
        run: |
          set -euo pipefail
          count=$(ls samples/*.docx | wc -l)
          echo "generated $count docx files"
          test "$count" -ge 5
