<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TenancyDesk — tenancy paperwork, done in minutes</title>
  <meta name="description" content="Turn tenancy document templates into a complete per-tenant document pack." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f5f4f'/><text x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='bold' fill='white' text-anchor='middle'>T</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">TD</span>
        <div>
          <h1>TenancyDesk</h1>
          <p>Tenancy paperwork, done in minutes</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="status-pill" class="pill">Connecting…</span>
        <button id="back-office" class="btn" type="button">Back office</button>
        <button id="new-pack" class="btn btn-primary" type="button">New tenant pack</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>Tenant packs</h2>
          <span id="pack-count" class="count">0</span>
        </div>
        <ul id="pack-list" class="pack-list" aria-label="Tenant packs"></ul>
        <div id="sidebar-empty" class="sidebar-empty" hidden>
          Nothing here yet. Create your first pack to get started.
        </div>
      </aside>

      <main id="main" class="main">
        <div class="empty-state">
          <h2>Loading…</h2>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
